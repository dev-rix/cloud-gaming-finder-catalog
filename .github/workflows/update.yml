name: Update provider catalogs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"
      timezone: "America/New_York"

permissions:
  contents: write

jobs:
  geforce-now:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser automation
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Update GeForce NOW catalog
        run: node providers/geforce-now/update.mjs
      - name: Validate catalog
        run: npm run validate
      - name: Commit catalog changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/providers/geforce-now.json
          git diff --cached --quiet || git commit -m "Update GeForce NOW catalog"
          git push
