name: Update provider catalogs

on:
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: "Publish even if the catalog lost more than 20% of its games"
        type: boolean
        default: false
  schedule:
    - cron: "0 5 * * *"
      timezone: "America/New_York"

# Nothing runs with write access by default; only the publish job below can
# push, and it never runs the browser or talks to NVIDIA.
permissions:
  contents: read

concurrency:
  group: update-catalogs
  cancel-in-progress: false

jobs:
  discover-geforce-now:
    # Public standard runners are sufficient for the daily browser discovery.
    # The workflow is the only place provider scraping should run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install browser automation
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Update GeForce NOW catalog
        env:
          ALLOW_CATALOG_SHRINK: ${{ inputs.allow_shrink && 'true' || 'false' }}
        run: node providers/geforce-now/update.mjs
      - name: Validate catalog
        run: npm run validate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: catalog
          path: |
            catalog/manifest.json
            catalog/providers/geforce-now.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: discover-geforce-now
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install validator
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: catalog
          path: catalog
      - name: Validate catalog
        run: npm run validate
      - name: Commit catalog changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/manifest.json catalog/providers/geforce-now.json
          git diff --cached --quiet || git commit -m "Update GeForce NOW catalog"
          git push
